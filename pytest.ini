[pytest]
# Pin the test root to the repository root so `pytest` works from any
# working directory (CI containers, `cd tests && pytest`, etc.) and the
# repo-root conftest.py -- which puts `src`/`app`/`scripts` on sys.path --
# is always collected. Without this, pytest's rootdir can resolve to tests/
# and the top-level conftest is never loaded.
testpaths = tests
